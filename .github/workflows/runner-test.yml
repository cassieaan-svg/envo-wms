name: Self-Hosted Runner Test

# Manual + PR only — deliberately NOT on push to main. This workflow shares the
# self-hosted runner's checkout directory with "Deploy to VM", and a default
# actions/checkout runs `git clean -ffdx`, which deletes the untracked
# backend/.env the backend depends on (dotenv reads it at runtime). Running it on
# every push raced the deploy and wiped .env, breaking DB auth (SASL: client
# password must be a string). The checkouts below also pin clean: false as a
# safety net so this can never nuke .env even on a PR/manual run.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke-test:
    name: Runner smoke test
    runs-on: self-hosted   # <-- this is what sends the job to YOUR runner
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          clean: false   # never git-clean the shared self-hosted workspace (keeps backend/.env)

      - name: Say hello from the runner
        shell: powershell
        run: |
          Write-Host "Runner is alive ✅"
          Write-Host "Machine : $env:COMPUTERNAME"
          Write-Host "Runner  : $env:RUNNER_NAME"
          Write-Host "OS      : $env:RUNNER_OS"
          Write-Host "Workdir : $(Get-Location)"

      - name: Show tool versions
        shell: powershell
        run: |
          node --version
          npm --version
          git --version

  build:
    name: Install & build
    runs-on: self-hosted
    needs: smoke-test
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          clean: false   # never git-clean the shared self-hosted workspace (keeps backend/.env)

      - name: Install & build frontend
        shell: powershell
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Install backend deps
        shell: powershell
        working-directory: backend
        run: npm install
