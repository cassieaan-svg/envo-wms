name: Deploy to VM

# Manual only — NO auto-deploy on push. Deploys are done deliberately by running
# deploy.ps1 on the VM (RDP), or by triggering this workflow from the Actions tab.
# Both do the same thing: git reset the dedicated clone at C:\envo\app to
# origin/main, build, publish the frontend to IIS, and pm2 restart the backend.
#
# The live backend/.env lives in C:\envo\app\backend and is set ONCE by hand — it
# is never regenerated from a secret here, so secret drift can't break prod.
on:
  workflow_dispatch:

# Never let two deploys run at once.
concurrency:
  group: deploy-vm
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Run deploy.ps1 against the dedicated clone
        shell: powershell
        # No actions/checkout: the live app is C:\envo\app, not the runner
        # workspace. deploy.ps1 there does the git pull + build + restart itself.
        run: |
          & "C:\envo\app\deploy.ps1"
